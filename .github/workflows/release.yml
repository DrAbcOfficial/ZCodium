name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号：填 3.14.0 会自动生成 3.14.0-audit.<当天日期>（同一天重复构建自动加 .2/.3）；也可直接填完整形式 3.14.0-audit.20260922[.2]"
        required: true
        type: string
      prerelease:
        description: "标记为预发布（Pre-release）"
        required: false
        type: boolean
        default: false
      build_artifacts:
        description: "构建 CLI 发行包和桌面客户端并上传到 Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 版本采用日期式命名（tag 名即时间序，避免 audit 序号在 GitHub 列表/排序里错位）：
          #   输入 3.14.0            -> 3.14.0-audit.<YYYYMMDD>，同一天重复构建自动追加 .2/.3/...
          #   输入完整日期形式        -> 严格按给定版本使用，不自动递增
          DATE="$(date -u +%Y%m%d)"
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            BASE="$VERSION-audit.$DATE"
            TAG="v$BASE"
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              SEQ=2
              while git ls-remote --tags origin "refs/tags/v$BASE.$SEQ" | grep -q .; do
                SEQ=$((SEQ + 1))
              done
              TAG="v$BASE.$SEQ"
            fi
          elif printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-audit\.[0-9]{8}(\.[0-9]+)?$'; then
            TAG="v$VERSION"
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
              echo "::error::Tag $TAG already exists; pass the base version (e.g. 3.14.0) to auto-sequence, or pick another date/suffix"
              exit 1
            fi
          else
            echo "::error::Invalid version \"$VERSION\". Use 3.14.0 (date and same-day sequence are appended automatically) or the full form 3.14.0-audit.20260922[.2]"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          cat > /tmp/release-notes.md <<'NOTES'
          ## 安装说明 / Installation

          > 安装包没有官方签名，首次打开会被系统安全机制拦截。
          > 这是预期行为，按下面各平台的方式放行一次即可；下载前可以先按本页 sha256.txt 校验文件。
          >
          > The builds have no official signature. Your system will block the first launch;
          > follow the per-platform steps below once. Verify downloads against sha256.txt first.

          ### macOS（.dmg）

          按机型下载 mac-arm64（Apple Silicon）或 mac-x64（Intel）的 .dmg，打开后把 ZCodium 拖进“应用程序”。没有官方签名，Gatekeeper 会拦截首次打开；**先把应用拖进「应用程序」，再执行**下面命令（提示输入密码时输入开机密码，输入过程屏幕上不显示任何字符）：

          ```bash
          sudo /usr/bin/xattr -rd com.apple.quarantine "/Applications/ZCodium.app"
          open -a "ZCodium"
          ```

          命令使用 /usr/bin/xattr 绝对路径，避免 PATH 中其他同名工具（例如 Python 的 xattr）干扰。也可以在“访达”里右键（Control-点击）应用 → 打开 → 弹窗里再点“打开”。

          ### Windows（.exe）

          双击安装。安装包没有官方签名，SmartScreen 会弹出“Windows 已保护你的电脑”的警告：
          点“**更多信息**” → “**仍要运行**”即可——这是预期提示，不是文件损坏。

          ### Linux（.AppImage）

          ```bash
          chmod +x ZCodium*linux*.AppImage
          ./ZCodium*linux*.AppImage
          ```

          ### CLI 发行包 / CLI package（.tar.gz）

          ```bash
          tar -xzf zcodium-*.tar.gz
          cd zcodium
          ./install.sh        # 安装 zcode 命令（默认到 ~/.zcode/runtime）
          # 或直接运行 / or run directly:
          node bin/zcode.mjs --help
          ```

          CLI 发行包需要 Node.js 24。桌面安装包由 CI 构建，没有官方签名。

          #### English

          - **macOS**: download the mac-arm64 (Apple Silicon) or mac-x64 (Intel) DMG, open it and drag ZCodium into Applications. The app has no official signature, so **after dragging** run `sudo /usr/bin/xattr -rd com.apple.quarantine "/Applications/ZCodium.app"` — enter your login password when asked (nothing is shown while typing) — or right-click (Control-click) the app → Open → Open. The absolute `/usr/bin/xattr` path avoids shadowing by other tools with the same name.
          - **Windows**: run the .exe installer. SmartScreen shows "Windows protected your PC" — click **More info** → **Run anyway**. This is the expected warning, not a corrupted file.
          - **Linux**: run `chmod +x ZCodium*linux*.AppImage && ./ZCodium*linux*.AppImage`.
          - **CLI**: Node.js 24 is required. Extract the tarball and run `./install.sh` (installs the `zcode` command into `~/.zcode/runtime`) or `node bin/zcode.mjs --help`.

          ## 关于这个版本 / About this release

          基于上游开源代码的审计版本：监控与遥测已全部移除，上游改动逐提交审阅。改动细节见仓库 README。

          Audited build based on the upstream open-source code: telemetry removed, upstream changes reviewed commit by commit. See the repository README for details.
          NOTES
          # 仅正式版追加更新日志；预发布版本不带 changelog。
          if [ "$PRERELEASE" != "true" ]; then
            PREV_STABLE="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"
            {
              echo
              echo "## 更新日志 / Changelog"
              echo
              if [ -n "$PREV_STABLE" ]; then
                echo "自上一个正式版 \`$PREV_STABLE\` 以来的变更 / Changes since \`$PREV_STABLE\`:"
                CHANGELOG_RANGE="$PREV_STABLE..$TAG"
              else
                echo "首个正式版，包含以下变更 / First stable release, includes the following changes:"
                CHANGELOG_RANGE="$(git rev-list --max-parents=0 HEAD)..$TAG"
              fi
              echo
              CHANGES="$(git log --no-merges --pretty='- %s (`%h`)' "$CHANGELOG_RANGE")"
              if [ -n "$CHANGES" ]; then
                printf '%s\n' "$CHANGES"
              else
                echo "- 无代码变更 / No code changes."
              fi
            } >> /tmp/release-notes.md
          fi
          args=(--title "$TAG" --notes-file /tmp/release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

  build:
    needs: release
    if: ${{ inputs.build_artifacts }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project references
        run: pnpm typecheck

      - name: Build ZCode CLI distribution
        env:
          ZCODE_DIST_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.release.outputs.tag }}/
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          pnpm build:zcode -- --version "${RELEASE_TAG#v}"

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          # GitHub API 偶发连接失败（runner 网络抖动），上传重试 3 次；--clobber 让重试可安全覆盖。
          for attempt in 1 2 3; do
            if gh release upload "$TAG" \
              dist/zcode/releases/*/zcodium-*.tar.gz \
              dist/zcode/releases/*/sha256.txt \
              dist/zcode/install.sh \
              dist/zcode/latest.json \
              --clobber; then
              exit 0
            fi
            echo "::warning::gh release upload failed (attempt $attempt/3), retrying in 10s"
            sleep 10
          done
          echo "::error::gh release upload failed after 3 attempts"
          exit 1

  desktop:
    needs: release
    if: ${{ inputs.build_artifacts }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: mac
            arch: arm64
            glob: "*.dmg"
          - runner: macos-15-intel
            target: mac
            arch: x64
            glob: "*.dmg"
          - runner: windows-latest
            target: win
            arch: x64
            glob: "*.exe"
          - runner: ubuntu-latest
            target: linux
            arch: x64
            glob: "*.AppImage"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project references
        run: pnpm typecheck

      - name: Bundle desktop app
        env:
          ZCODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm bundle:desktop -- --os ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Upload desktop asset to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          ls -la packages/desktop/dist/
          # latest*.yml 是 electron-updater 的更新元数据，应用靠它做自动更新；
          # macOS 自动更新需要 zip 包（electron-updater 用 zip 而不是 dmg），blockmap 供差分下载。
          shopt -s nullglob
          files=(
            packages/desktop/dist/${{ matrix.glob }}
            packages/desktop/dist/latest*.yml
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.blockmap
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no desktop assets matched in packages/desktop/dist"
            exit 1
          fi
          # GitHub API 偶发连接失败（runner 网络抖动），上传重试 3 次；--clobber 让重试可安全覆盖。
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "${files[@]}" --clobber; then
              exit 0
            fi
            echo "::warning::gh release upload failed (attempt $attempt/3), retrying in 10s"
            sleep 10
          done
          echo "::error::gh release upload failed after 3 attempts"
          exit 1
